name: Bug Report
description: General bug report for Mega Engineering Suite UI, logic, or behavior
title: "[BUG] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Application Version
      description: e.g. 1.2.2
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How do we reproduce this?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: input
    id: runid
    attributes:
      label: Run ID
      description: If a generation failed, paste the RUN-YYYYMMDD-HHMMSS-XXXX here.
    validations:
      required: false
